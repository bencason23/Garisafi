services:
  - type: web
    name: garisafi-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
